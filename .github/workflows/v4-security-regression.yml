name: v4 security regression
on:
  pull_request:
    paths:
      - 'assurance/v4/**'
      - 'tools/**'
      - 'tests/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v4.txt
      - run: python tools/Invoke-V4FinalGates.py --profile security-regression
