name: v4 report quality
on:
  pull_request:
    paths:
      - 'assurance/v4/checkpoint6/**'
      - 'assurance/v4/checkpoint7/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v4.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/Invoke-V4FinalGates.py --profile report-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-report-quality
          path: build/v4-final-gates/
          if-no-files-found: ignore
