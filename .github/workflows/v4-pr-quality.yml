name: v4 PR quality
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pr-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-v4.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/Invoke-V4FinalGates.py --profile pr-quality
