name: v4 release gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v4.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run release gate (evidence log outside the repository)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/v4-final-gates"
          python tools/Invoke-V4FinalGates.py --profile release 2>&1 | tee "$RUNNER_TEMP/v4-final-gates/release-gate.log"
          git rev-parse HEAD > "$RUNNER_TEMP/v4-final-gates/commit.txt"
          rel=$(jq -r .release assurance/v4/checkpoint10/manifest.json)
          sha256sum "release/$rel/release-manifest.json" "release/$rel/SHA256SUMS" > "$RUNNER_TEMP/v4-final-gates/release-files.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: v4-release-gate-evidence
          path: ${{ runner.temp }}/v4-final-gates/
          if-no-files-found: error
