# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed.
# Notes come from the matching CHANGELOG section; the script is attached.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: v4 publication approval gate (approved manifest + SHA256SUMS)
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v[4-9].*)
              d="release/$GITHUB_REF_NAME"
              test -f "$d/release-manifest.json" || { echo "Missing $d/release-manifest.json"; exit 1; }
              jq -e --arg r "$GITHUB_REF_NAME" '.release == $r and .publishable == true and .status == "APPROVED_FOR_PUBLICATION" and .securityReview.decision == "APPROVED" and ((.blockers // []) | length) == 0' "$d/release-manifest.json" > /dev/null || { echo "$GITHUB_REF_NAME is not approved for publication"; exit 1; }
              sha256sum -c "$d/SHA256SUMS"
              ;;
          esac
      - name: Check version in the script
        run: grep -q "$GITHUB_REF_NAME" scripts/Invoke-ArcPostureReview.ps1 || { echo "Tag $GITHUB_REF_NAME not found in the script"; exit 1; }
      - name: PSScriptAnalyzer gate (no Error/Warning findings)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $found | Format-Table Severity, RuleName, Line, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($found.Count) { Write-Error "$($found.Count) PSScriptAnalyzer finding(s): release not created. Fix and publish a new version."; exit 1 }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install report-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Report contract gate
        run: |
          python tools/Sync-ReportAssets.py --check
          python tools/Test-ReportContract.py
      - name: Browser regression gate
        run: python tools/Test-ReportVisual.py
      - name: Extract release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $v"; exit 1; }
      - name: Create or update release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating notes and replacing the asset."
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" scripts/Invoke-ArcPostureReview.ps1 --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md scripts/Invoke-ArcPostureReview.ps1
          fi
