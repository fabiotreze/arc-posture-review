# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed.
# Notes come from the matching CHANGELOG section; the script is attached.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version in the script
        run: grep -q "$GITHUB_REF_NAME" scripts/Invoke-ArcPostureReview.ps1 || { echo "Tag $GITHUB_REF_NAME not found in the script"; exit 1; }
      - name: PSScriptAnalyzer gate (no Error/Warning findings)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $found | Format-Table Severity, RuleName, Line, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($found.Count) { Write-Error "$($found.Count) PSScriptAnalyzer finding(s): release not created. Fix and publish a new version."; exit 1 }
      - name: Extract release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $v"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md scripts/Invoke-ArcPostureReview.ps1
