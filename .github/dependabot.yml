# Keeps the GitHub Actions used by the workflows up to date.
# One grouped pull request per month; commit messages start with "ci".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
